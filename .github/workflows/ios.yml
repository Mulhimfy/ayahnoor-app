name: iOS

# Builds Mulhimfy/ayahnoor (private; read-only deploy key) on a GitHub Mac and uploads it to App
# Store Connect (TestFlight / App Review). Signing: a fixed Apple Development certificate for the
# archive and Apple's cloud-managed distribution certificate for the App Store export, both driven
# by the App Store Connect API key. Nothing is uploaded as an artifact: secrets never leave the runner.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of Mulhimfy/ayahnoor
        default: main
      upload:
        description: Upload to App Store Connect (off = archive, sign and export only, as a check)
        type: boolean
        default: true

permissions:
  contents: read

concurrency: ios

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      TEAM_ID: 2FH7TS9BNA
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check for the iOS secrets
        env:
          P12: ${{ secrets.IOS_DEV_P12_B64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$P12" ]; then echo "::error::Missing iOS secrets"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahnoor
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.AYAHNOOR_DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Flutter build (unsigned; sets version, pods/packages, assets)
        working-directory: app
        env:
          # the word timing's read key (lib/audio/word_timing.dart); Generated.xcconfig carries it to the archive
          WORDS_KEY: ${{ secrets.WORDS_KEY }}
        run: |
          flutter pub get > "$RUNNER_TEMP/pub.log" 2>&1
          flutter build ios --release --no-codesign --build-number="${GITHUB_RUN_NUMBER}" --dart-define=WORDS_KEY="$WORDS_KEY" > "$RUNNER_TEMP/flutter.log" 2>&1 \
            || { tail -40 "$RUNNER_TEMP/flutter.log"; exit 1; }
          grep -E "^Built|✓" "$RUNNER_TEMP/flutter.log" | tail -3 || true
      - name: Signing keychain and API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEV_P12_B64: ${{ secrets.IOS_DEV_P12_B64 }}
          IOS_DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/an.keychain-db"
          kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$IOS_DEV_P12_B64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -P "$IOS_DEV_P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        working-directory: app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AyahNoor.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E '^(error|\*\* )|error:' "$RUNNER_TEMP/archive.log" | head -40 || true
          test -d "$RUNNER_TEMP/AyahNoor.xcarchive" || { tail -60 "$RUNNER_TEMP/archive.log" | grep -v -i -E "key|token|password|secret"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" -c "Print :ApplicationProperties:CFBundleVersion" "$RUNNER_TEMP/AyahNoor.xcarchive/Info.plist"
      - name: Export (and upload to App Store Connect)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${{ inputs.upload && 'upload' || 'export' }}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AyahNoor.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | grep -v -i -E "authkey|token" | tail -30
          test ${PIPESTATUS[0]} -eq 0
          ls -l "$RUNNER_TEMP/export" | grep -v -i -E "authkey" || true
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/an.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/dev.p12"
